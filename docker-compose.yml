services:
  chf-web:
    build: .
    container_name: chf-fastapi
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - JWT_SECRET=${JWT_SECRET:-PRODUCTION_SECRET_KEY_CHANGE_ME}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-chf-media}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - DB_PATH=/app/data/chf_archive.db
      - UPLOAD_DIR=/app/data/uploads
      - HTTPS_ENABLED=true
      - SITE_PUBLIC_ORIGIN=${SITE_PUBLIC_ORIGIN:-https://www.chfexperience.com}
      - CCAVENUE_MODE=${CCAVENUE_MODE:-PRODUCTION}
      - CCAVENUE_MERCHANT_ID=${CCAVENUE_MERCHANT_ID:-2934389}
      - CCAVENUE_ACCESS_CODE=${CCAVENUE_ACCESS_CODE:-AVFG94NG06AF44GFFA}
      - CCAVENUE_WORKING_KEY=${CCAVENUE_WORKING_KEY:-F87E75A5907420050076D82F20AF1FCE}
      - CCAVENUE_GATEWAY_URL=${CCAVENUE_GATEWAY_URL:-https://secure.ccavenue.com/transaction/transaction.do?command=initiateTransaction}
    volumes:
      - chf_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/site-content?page=global >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  whatsapp:
    build: 
      context: .
      dockerfile: Dockerfile.whatsapp
    container_name: chf-whatsapp
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - whatsapp_data:/app/.wwebjs_auth_v2

volumes:
  chf_data:
  whatsapp_data:
